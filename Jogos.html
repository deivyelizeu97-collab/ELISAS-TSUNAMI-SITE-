<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogos - ELISAS TSUNAMI</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    header {
      text-align: center;
      padding: 30px 15px;
      background: #1b1b1b;
    }

    h1 {
      margin: 0;
    }

    .categorias {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      padding: 25px;
    }

    .categoria {
      padding: 25px 10px;
      text-align: center;
      background: #222;
      border-radius: 10px;
      cursor: pointer;
    }

    .categoria:hover {
      background: #333;
    }

    a {
      color: white;
      text-decoration: none;
    }

    .voltar {
      display: block;
      width: fit-content;
      margin: 10px auto 30px;
      padding: 12px 20px;
      background: #444;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <header>
    <h1>ELISAS TSUNAMI</h1>
    <p>Jogos e acessórios</p>
  </header>

  <main>
    <div class="categorias">

      <a href="#ps3">
        <div class="categoria">PlayStation 3</div>
      </a>

      <a href="#ps4">
        <div class="categoria">PlayStation 4</div>
      </a>

      <a href="#ps5">
        <div class="categoria">PlayStation 5</div>
      </a>

      <a href="#xbox">
        <div class="categoria">Xbox</div>
      </a>

      <a href="#psp">
        <div class="categoria">PSP</div>
      </a>

      <a href="#acessorios">
        <div class="categoria">Acessórios</div>
      </a>

    </div>

    <a class="voltar" href="index.html">Voltar ao início</a>
  </main>

</body>
  </html>
